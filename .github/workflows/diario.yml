name: Detector de valor

on:
  schedule:
    # Revisión diaria: 8:00 am del centro de México (UTC-6, sin horario de
    # verano desde 2022) = 14:00 UTC. Una sola consulta de momios al día.
    - cron: "0 14 * * *"
    # Captura de cierre: cada 30 min revisa si alguna jugada del registro empieza
    # en los próximos 45 min. Si no hay, no gasta créditos. Los minutos de
    # Actions son ilimitados porque el repositorio es público.
    - cron: "15,45 * * * *"
  # Este es el botón: Actions -> Detector de valor -> "Run workflow".
  # Deja "forzar" en true y revisa en ese momento, sin esperar los intervalos.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Revisar ahora mismo, ignorando los intervalos de la agenda"
        type: boolean
        default: true
      solo_pagina:
        description: "Solo rehacer la página con lo último guardado (no gasta créditos)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: detector
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar valor
        if: github.event.schedule != '15,45 * * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main ${{ inputs.solo_pagina && '--rehacer' || ((github.event_name == 'schedule' || inputs.forzar) && '--forzar' || '') }}

      - name: Capturar líneas de cierre
        if: github.event.schedule == '15,45 * * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.cierre

      - name: Guardar estado
        run: |
          git config user.name  "detector"
          git config user.email "detector@users.noreply.github.com"
          git add docs datos
          git diff --staged --quiet || git commit -m "corrida $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push

      - uses: actions/upload-pages-artifact@v3
        if: github.event.schedule != '15,45 * * * *'
        with:
          path: docs

  publicar:
    needs: correr
    if: github.event.schedule != '15,45 * * * *'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
