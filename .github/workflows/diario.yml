name: Detector de valor

on:
  schedule:
    # Cada 30 min en el horario donde hay deporte (14:00-05:59 UTC = 8am-medianoche
    # del centro de México). Fuera de esa ventana casi no hay partidos y sería
    # gastar minutos de GitHub para nada.
    #
    # CUIDADO CON LOS MINUTOS DE ACTIONS: un repositorio privado trae 2,000 min
    # gratis al mes y cada corrida gasta ~1.5. Esta configuración usa ~1,800.
    # Si quieres cada 15 min, haz el repositorio público (minutos ilimitados) o
    # paga minutos extra. No cambies el cron sin sacar la cuenta.
    - cron: "*/30 14-23 * * *"
    - cron: "*/30 0-5 * * *"
    # Captura de líneas de cierre antes del grueso de los partidos.
    - cron: "50 23 * * *"
  # Este es el botón: Actions -> Detector de valor -> "Run workflow".
  # Deja "forzar" en true y revisa en ese momento, sin esperar los intervalos.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Revisar ahora mismo, ignorando los intervalos de la agenda"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: detector
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar valor
        if: github.event.schedule != '50 23 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main ${{ (github.event_name == 'workflow_dispatch' && inputs.forzar) && '--forzar' || '' }}

      - name: Capturar líneas de cierre
        if: github.event.schedule == '50 23 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.cierre

      - name: Guardar estado
        run: |
          git config user.name  "detector"
          git config user.email "detector@users.noreply.github.com"
          git add docs datos
          git diff --staged --quiet || git commit -m "corrida $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: correr
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
