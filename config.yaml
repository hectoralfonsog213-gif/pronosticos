#  Configuración del detector diario
#
#  UNA revisión al día, a las 8 am (hora del centro de México), con los partidos
#  que empiezan en las siguientes horizonte_horas. Todos los mercados.
#
#  CUOTA: la API cobra (mercados x regiones) créditos por liga consultada.
#  Una liga sin partidos ese día no se consulta y no cuesta nada.
#  El plan gratis da 500 créditos al mes: unos 16 al día, o sea ~5 ligas con
#  3 mercados. Si un día juegan más ligas de las que alcanzan, se atienden en el
#  orden de esta lista (prioridad: config) y las demás se saltan ese día.
#  Aparte, la captura de cierre gasta 1-3 créditos por liga con jugada del día.
#
#  Claves de liga vigentes:  python -m src.main --verificar   (gratis)

# Cada región extra MULTIPLICA el costo. "eu" trae casas europeas y suele dar
# mejores líneas en fútbol.
regiones:
  - us

# Solo partidos que empiezan dentro de estas horas desde la revisión:
# 8 am + 18 h = 2 am del día siguiente, cubre los juegos nocturnos.
horizonte_horas: 18

# Con presupuesto corto, primero las ligas que aparecen antes en esta lista.
prioridad: config

deportes:

  mlb:
    activo: true
    usar_modelo: true
    ligas:
      - baseball_mlb
    mercados:
      - h2h              # ganador
      - totals           # más/menos carreras — el modelo SÍ opina aquí
      - spreads          # línea de carreras (-1.5) — solo detector de mercado

  nfl:
    activo: true
    usar_modelo: true
    ligas:
      - americanfootball_nfl
    mercados:
      - h2h              # ganador
      - spreads          # hándicap — el modelo SÍ opina aquí
      - totals           # más/menos puntos — solo detector de mercado

  futbol:
    activo: true
    usar_modelo: true
    # En orden de prioridad. Las de abajo solo entran los días que sobra cuota.
    ligas:
      - soccer_mexico_ligamx
      - soccer_epl
      - soccer_spain_la_liga
      - soccer_uefa_champs_league
      - soccer_italy_serie_a
      - soccer_germany_bundesliga
      - soccer_france_ligue_one
      - soccer_uefa_europa_league
      - soccer_usa_mls
      - soccer_conmebol_copa_libertadores
      - soccer_brazil_campeonato
      - soccer_argentina_primera_division
      - soccer_portugal_primeira_liga
      - soccer_netherlands_eredivisie
      - soccer_uefa_europa_conference_league
      - soccer_conmebol_copa_sudamericana
      - soccer_efl_champ
      - soccer_turkey_super_league
      - soccer_belgium_first_div
      - soccer_spl
      - soccer_uefa_nations_league
      - soccer_england_efl_cup
      - soccer_germany_dfb_pokal
      - soccer_spain_segunda_division
      - soccer_italy_serie_b
      - soccer_germany_bundesliga2
      - soccer_france_ligue_two
      - soccer_brazil_serie_b
      - soccer_chile_campeonato
      - soccer_austria_bundesliga
      - soccer_switzerland_superleague
      - soccer_denmark_superliga
      - soccer_greece_super_league
      - soccer_norway_eliteserien
      - soccer_sweden_allsvenskan
      - soccer_australia_aleague
      - soccer_korea_kleague1
      - soccer_england_league1
      - soccer_england_league2
      - soccer_germany_liga3
      - soccer_league_of_ireland
      - soccer_finland_veikkausliiga
      - soccer_sweden_superettan
    mercados:
      - h2h              # 1X2
      - totals           # más/menos goles — el modelo SÍ opina aquí
      - spreads          # hándicap asiático — el modelo SÍ opina aquí

# --------------------------------------------------------------- salida
# "una_jugada":      UNA sola apuesta, la mejor del momento, o ninguna si nada
#                    pasa el filtro.
# "una_por_deporte": la mejor de cada deporte (NFL, MLB, fútbol). Máximo una
#                    por deporte, y si un deporte no tiene nada, no aparece.
# "todas":           todas las que superan el umbral, hasta tope_jugadas.
#
# En los tres casos cada jugada trae su momio mínimo aceptable, para cuando la
# pongas en tu propia casa a un precio distinto del que aquí aparece.
modo: todas

# Con true, la jugada única nunca puede ser de las que solo sostiene el modelo.
# Si vas a hacer una sola apuesta, no conviene gastarla en la categoría con más
# riesgo de estar equivocada.
exigir_respaldo_mercado: true

# ---------------------------------------------------------------- cuota
# Créditos que tiene tu plan al mes. El sistema raciona solo: calcula cuánto le
# toca por día, atiende primero los partidos más próximos, y si va pasado de
# gasto pospone lo lejano. Nunca se queda sin créditos a media quincena.
#   plan gratis de The Odds API = 500
presupuesto_mensual: 500

# Con una revisión diaria: una sola ventana que cubre el día, sin esperar entre
# consultas (la revisión de las 8 am corre con --forzar de todos modos).
escala:
  - {horas_antes: 18.0, minutos_entre_consultas: 0}

# Detector de líneas rezagadas: compara el consenso de hace X minutos contra
# el de ahora. Si el mercado se movió y una casa no siguió, ahí hay valor.
movimiento:
  ventana_min: 120
  umbral: 0.025          # 2.5 puntos porcentuales de desplazamiento
  retencion_dias: 3      # historial que se conserva (más días = repo más pesado)

# Arbitrajes y middles. No dependen de ningún pronóstico.
arbitraje:
  margen_minimo: 0.005   # 0.5% garantizado para que valga el trámite
  ancho_minimo: 1.0      # ventana mínima del middle
  perdida_maxima: 0.06   # cuánto aceptas perder cuando el middle falla
  ev_minimo_middle: 0.03

# Topes de exposición. Kelly supone apuestas independientes; el ganador y el
# hándicap del mismo equipo no lo son, ni tres partidos del mismo equipo.
exposicion:
  tope_evento: 0.03      # máximo de banca comprometida en un solo partido
  tope_equipo: 0.04      # máximo ligado al mismo equipo en el día
  tope_total: 0.15       # máximo en riesgo al mismo tiempo

umbrales:
  ev_minimo_mercado: 0.02     # 2% contra el consenso de las demás casas
  ev_minimo_modelo: 0.04      # al modelo propio se le exige el doble
  casas_minimas: 4            # con menos, el consenso es ruido
  vig_maximo: 0.09            # ignorar casas con comisión absurda
  fraccion_kelly: 0.25
  tope_stake: 0.02            # techo duro: 2% de banca por jugada
  momio_minimo: 1.30          # -333
  momio_maximo: 6.00          # +500
  # Solo jugadas que ganan al menos la mitad de las veces. Entre esas se sigue
  # eligiendo la de mayor valor esperado, NO la más probable: ordenar por
  # probabilidad da puros favoritos a -1200 que no pagan lo que arriesgan.
  p_minima: 0.50
  metodo_devig: power

max_por_evento: 2             # más de 2 jugadas en un partido casi siempre es error
tope_jugadas: 25

# Peso de cada casa dentro del consenso. Las afiladas mueven la línea primero y
# deben pesar más; las blandas copian. Si algún día tienes acceso a Pinnacle o
# Betfair, ponles peso 3 o 4: cambian por completo la calidad del detector.
pesos_casa:
  Pinnacle: 4.0
  Betfair: 3.0
  BetOnline.ag: 2.0
  Bookmaker.eu: 2.0
  DraftKings: 1.2
  FanDuel: 1.2
  LowVig.ag: 2.0
  BetMGM: 1.0
  Caesars: 1.0
  BetRivers: 0.8
  Bovada: 0.8

# Parámetros por liga para el modelo de fútbol. Se calculan con
# src.models.futbol.calibrar() sobre una temporada de resultados.
# Sin entrada aquí, se usan los valores por defecto (ligas grandes de Europa).
parametros_liga:
  Liga MX:
    goles_promedio: 2.62
    ventaja_local: 0.28
    elo_a_goles: 0.0042
    rho: -0.11

telegram:
  activo: false
  # El token y el chat_id van como secretos del repositorio,
  # nunca escritos aquí: TELEGRAM_TOKEN y TELEGRAM_CHAT_ID.
